<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 512 512">

<defs>

<linearGradient
id="gradient"
x1="0"
y1="0"
x2="1"
y2="1">

<stop
offset="0%"
stop-color="#00e5ff"/>

<stop
offset="100%"
stop-color="#00ff91"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur
stdDeviation="10"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode
in="SourceGraphic"/>

</feMerge>

</filter>

</defs>


<rect
width="512"
height="512"
rx="110"
fill="#020812"/>


<circle
cx="256"
cy="256"
r="190"
fill="#061b2b"
stroke="url(#gradient)"
stroke-width="8"
filter="url(#glow)"/>


<!-- ROBOT HEAD -->

<rect
x="128"
y="150"
width="256"
height="210"
rx="60"
fill="#09243a"
stroke="#00e5ff"
stroke-width="10"/>


<!-- EYES -->

<circle
cx="205"
cy="245"
r="25"
fill="#00ff91"/>


<circle
cx="307"
cy="245"
r="25"
fill="#00ff91"/>


<!-- MOUTH -->

<path
d="M190 305 Q256 340 322 305"
fill="none"
stroke="#00e5ff"
stroke-width="12"
stroke-linecap="round"/>


<!-- ANTENNA -->

<path
d="M256 150 V105"
stroke="#00e5ff"
stroke-width="12"
stroke-linecap="round"/>


<circle
cx="256"
cy="90"
r="18"
fill="#00ff91"/>


<!-- SIDES -->

<path
d="M128 215 H92"
stroke="#00e5ff"
stroke-width="12"
stroke-linecap="round"/>


<path
d="M384 215 H420"
stroke="#00e5ff"
stroke-width="12"
stroke-linecap="round"/>

</svg>
