<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

content="#061525">

<title>myROBOT NETWORK TOPOLOGY</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{

    min-height:100vh;

    color:white;

    background:
    radial-gradient(
        circle at top,
        #10304c 0%,
        #061321 45%,
        #020812 100%
    );

}

.container{

    width:100%;
    max-width:760px;

    margin:auto;

    padding:12px;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    background:
    linear-gradient(
        135deg,
        #087cff,
        #00b8ff,
        #0755a0
    );

    border-radius:24px;

    padding:20px;

    margin-bottom:12px;

    box-shadow:
    0 15px 40px
    rgba(0,0,0,.45);

}

.header h1{

    font-size:23px;

}

.header p{

    margin-top:7px;

    font-size:11px;

    opacity:.9;

}


/* =====================================================
   STATUS
===================================================== */

.status-card{

    background:
    rgba(13,31,49,.95);

    border:
    1px solid
    #1b405e;

    border-radius:18px;

    padding:15px;

    margin-bottom:12px;

}

.status-row{

    display:flex;

    justify-content:
    space-between;

    align-items:center;

}

.online-text{

    color:#4ade80;

    font-weight:bold;

}

.offline-text{

    color:#fb7185;

    font-weight:bold;

}


/* =====================================================
   TOPOLOGY
===================================================== */

.topology{

    background:

    radial-gradient(
        circle at center,
        #0d2942,
        #061321 70%
    );

    border:
    1px solid
    #17405e;

    border-radius:25px;

    padding:15px;

    margin-bottom:12px;

    overflow:hidden;

}

.topology-title{

    text-align:center;

    font-size:16px;

    font-weight:bold;

    margin-bottom:20px;

}


/* =====================================================
   TOWER
===================================================== */

.tower-area{

    position:relative;

    min-height:650px;

}


/* =====================================================
   INTERNET NODE
===================================================== */

.internet-node{

    position:relative;

    z-index:5;

    width:180px;

    margin:auto;

    padding:15px;

    text-align:center;

    border-radius:20px;

    background:
    linear-gradient(
        135deg,
        #0869c9,
        #00a9e8
    );

    border:
    2px solid
    #38c8ff;

    box-shadow:
    0 0 25px
    rgba(0,190,255,.45);

}

.internet-icon{

    font-size:35px;

}

.internet-title{

    font-size:15px;

    font-weight:bold;

    margin-top:5px;

}

.internet-sub{

    font-size:10px;

    opacity:.8;

}


/* =====================================================
   MAIN TOWER
===================================================== */

.tower{

    position:absolute;

    top:105px;

    left:50%;

    transform:
    translateX(-50%);

    width:130px;

    height:270px;

}


/* tower legs */

.tower-leg{

    position:absolute;

    bottom:0;

    width:5px;

    height:240px;

    background:
    linear-gradient(
        180deg,
        #5c7991,
        #1b405a
    );

}

.tower-leg.left{

    left:15px;

    transform:
    rotate(8deg);

}

.tower-leg.right{

    right:15px;

    transform:
    rotate(-8deg);

}


/* tower cross bars */

.cross{

    position:absolute;

    left:18px;

    right:18px;

    height:4px;

    background:#39728f;

    transform:rotate(0deg);

}

.cross1{top:40px;}
.cross2{top:85px;}
.cross3{top:130px;}
.cross4{top:175px;}
.cross5{top:220px;}


/* antenna */

.antenna{

    position:absolute;

    top:-18px;

    left:50%;

    transform:
    translateX(-50%);

    width:5px;

    height:55px;

    background:#79dfff;

}

.antenna-light{

    position:absolute;

    top:-27px;

    left:50%;

    transform:
    translateX(-50%);

    width:12px;

    height:12px;

    border-radius:50%;

    background:#ff394f;

    box-shadow:
    0 0 15px
    #ff394f;

    animation:
    blink 1s infinite;

}

@keyframes blink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.25;
    }

}


/* =====================================================
   RADIO WAVES
===================================================== */

.wave{

    position:absolute;

    top:-45px;

    left:50%;

    transform:
    translateX(-50%);

    border:
    2px solid
    #22cfff;

    border-radius:50%;

    opacity:0;

    animation:
    wave 2.5s infinite;

}

.wave1{

    width:70px;
    height:70px;

}

.wave2{

    width:120px;
    height:120px;

    animation-delay:
    .7s;

}

.wave3{

    width:180px;
    height:180px;

    animation-delay:
    1.4s;

}

@keyframes wave{

    0%{

        transform:
        translateX(-50%)
        scale(.5);

        opacity:.8;

    }

    100%{

        transform:
        translateX(-50%)
        scale(1.3);

        opacity:0;

    }

}


/* =====================================================
   MIKROTIK
===================================================== */

.router-node{

    position:absolute;

    top:390px;

    left:50%;

    transform:
    translateX(-50%);

    z-index:5;

    width:210px;

    padding:15px;

    text-align:center;

    background:
    linear-gradient(
        135deg,
        #172f47,
        #0a5679
    );

    border:
    2px solid
    #25bfff;

    border-radius:18px;

    box-shadow:
    0 0 25px
    rgba(0,190,255,.35);

}

.router-icon{

    font-size:30px;

}

.router-name{

    font-weight:bold;

    margin-top:4px;

}

.router-ip{

    font-size:11px;

    color:#62d5ff;

    margin-top:4px;

}


/* =====================================================
   CONNECTION LINE
===================================================== */

.main-line{

    position:absolute;

    top:65px;

    left:50%;

    transform:
    translateX(-50%);

    width:4px;

    height:330px;

    background:
    #16445f;

    overflow:hidden;

}

.data-flow{

    position:absolute;

    width:4px;

    height:70px;

    background:
    linear-gradient(
        180deg,
        transparent,
        #29d7ff,
        transparent
    );

    animation:
    flowDown 1.4s
    linear infinite;

}

@keyframes flowDown{

    from{
        top:-80px;
    }

    to{
        top:330px;
    }

}


/* =====================================================
   USER CONNECTIONS
===================================================== */

.user-lines{

    position:absolute;

    top:505px;

    left:0;

    right:0;

    height:80px;

}

.user-lines::before{

    content:"";

    position:absolute;

    top:15px;

    left:10%;

    right:10%;

    height:3px;

    background:#17445f;

}

.user-dot{

    position:absolute;

    top:9px;

    width:14px;

    height:14px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:
    0 0 15px
    #22c55e;

}


/* =====================================================
   USERS
===================================================== */

.users{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:8px;

    position:absolute;

    top:525px;

    left:0;

    right:0;

}

.user-card{

    position:relative;

    background:
    #102337;

    border:
    1px solid
    #23506c;

    border-radius:15px;

    padding:10px;

    text-align:center;

    cursor:pointer;

    transition:.2s;

}

.user-card:active{

    transform:
    scale(.95);

}

.user-card.online{

    border-color:
    #16864b;

}

.user-card.offline{

    border-color:
    #73313e;

    opacity:.7;

}

.user-avatar{

    font-size:27px;

}

.user-name{

    font-size:12px;

    font-weight:bold;

    margin-top:4px;

}

.user-status{

    font-size:9px;

    margin-top:5px;

}

.user-card.online
.user-status{

    color:#4ade80;

}

.user-card.offline
.user-status{

    color:#fb7185;

}


/* =====================================================
   BUTTON
===================================================== */

button{

    width:100%;

    border:0;

    border-radius:15px;

    padding:15px;

    margin-bottom:10px;

    color:white;

    font-size:15px;

    font-weight:bold;

    background:#087cff;

}

button:active{

    transform:
    scale(.98);

}

.speed-button{

    background:#159447;

}

.sound-button{

    background:#7135b8;

}


/* =====================================================
   LOG
===================================================== */

.log{

    max-height:200px;

    overflow:auto;

    background:#06111d;

    border:
    1px solid
    #19364c;

    border-radius:15px;

    padding:10px;

}

.log-item{

    padding:7px 0;

    border-bottom:
    1px solid
    #14293b;

    font-size:10px;

    color:#91a8bb;

}

.log-online{

    color:#4ade80;

}

.log-offline{

    color:#fb7185;

}


/* =====================================================
   DETAIL POPUP
===================================================== */

.overlay{

    display:none;

    position:fixed;

    inset:0;

    z-index:9999;

    background:
    rgba(0,0,0,.78);

    backdrop-filter:
    blur(7px);

    align-items:center;

    justify-content:center;

    padding:15px;

}

.detail{

    width:100%;

    max-width:430px;

    max-height:
    90vh;

    overflow:auto;

    background:
    linear-gradient(
        160deg,
        #0c1d2f,
        #102c45
    );

    border:
    2px solid
    #168ed1;

    border-radius:25px;

    padding:20px;

    animation:
    popup .25s ease;

}

@keyframes popup{

    from{

        transform:
        scale(.75);

        opacity:0;

    }

    to{

        transform:
        scale(1);

        opacity:1;

    }

}

.detail-head{

    text-align:center;

    margin-bottom:15px;

}

.detail-avatar{

    font-size:55px;

}

.detail-name{

    font-size:23px;

    font-weight:bold;

}

.detail-status{

    margin-top:5px;

    font-size:13px;

}

.detail-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:8px;

}

.detail-item{

    background:#162d43;

    border-radius:13px;

    padding:12px;

}

.detail-label{

    font-size:9px;

    color:#7894ab;

    margin-bottom:5px;

}

.detail-value{

    font-size:14px;

    font-weight:bold;

}

.blue{
    color:#53caff;
}

.green{
    color:#4ade80;
}

.purple{
    color:#c084fc;
}

.red{
    color:#fb7185;
}

.close{

    margin-top:15px;

    margin-bottom:0;

    background:#d83249;

}


/* =====================================================
   POPUP ALERT
===================================================== */

.alert-popup{

    text-align:center;

}

.alert-icon{

    font-size:60px;

}

.alert-title{

    font-size:23px;

    font-weight:bold;

    margin:10px 0;

}

.alert-message{

    font-size:14px;

    line-height:1.6;

    color:#b8c9d8;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:430px){

    .users{

        grid-template-columns:
        repeat(3,1fr);

    }

    .user-card{

        padding:7px;

    }

}

@media(max-width:350px){

    .users{

        grid-template-columns:
        1fr;

        top:520px;

    }

    .tower-area{

        min-height:850px;

    }

}

</style>

</head>

<script>


/* =====================================================

const users=[

{

name:"ASEP",

ip:"10.10.80.10",

mac:"AA:BB:CC:11:22:33",

status:"online",

uptime:0,

download:0,

},

{

uptime:0,

},

{

name:"USER 03",

ip:"10.10.80.12",

mac:"AA:BB:CC:77:88:99",

status:"offline",

uptime:0,

download:0,

upload:0,

speed:0,

gps:"Belum tersedia",

lastSeen:"--"

}

];


let previousStatus={};

let soundEnabled=false;

let audioContext=null;


/* =====================================================
   FORMAT BYTES
===================================================== */

function formatBytes(bytes){

if(!bytes)
return "0 B";

const units=[
"B",
"KB",
"MB",
"GB",
"TB"
];

const i=Math.floor(
Math.log(bytes)/
Math.log(1024)
);

return (
bytes/
Math.pow(1024,i)
).toFixed(2)
+" "
+units[i];

}


/* =====================================================
   UPTIME
===================================================== */

function formatUptime(seconds){

const days=
Math.floor(
seconds/86400
);

const hours=
Math.floor(
(seconds%86400)/3600
);

const minutes=
Math.floor(
(seconds%3600)/60
);

return (
days+"h "
+hours+"j "
+minutes+"m"
);

}


/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(){

const box=
document.getElementById(
"users"
);

box.innerHTML="";

let active=0;


users.forEach(
(user,index)=>{

if(
user.status==="online"
)
active++;


const card=
document.createElement(
"div"
);

card.className=
"user-card "
+user.status;


card.onclick=()=>{

showUserDetail(user);

};


card.innerHTML=`

<div class="user-avatar">
📱
</div>

<div class="user-name">
${user.name}
</div>

<div class="user-status">

${
user.status==="online"
?
"🟢 ONLINE"
:
"🔴 OFFLINE"
}

</div>

`;


box.appendChild(card);

}
);


document.getElementById(
"activeUsers"
).textContent=active;


/* USER DOT */

renderUserDots();

}


/* =====================================================
   USER DOTS
===================================================== */

function renderUserDots(){

const box=
document.getElementById(
"userLines"
);

box.innerHTML="";

const positions=[
16.5,
50,
83.5
];

users.forEach(
(user,i)=>{

const dot=
document.createElement(
"div"
);

dot.className=
"user-dot";

dot.style.left=
positions[i]+"%";

if(
user.status==="offline"
){

dot.style.background=
"#ef4444";

dot.style.boxShadow=
"0 0 15px #ef4444";

}

box.appendChild(dot);

}
);

}

   USER DETAIL
===================================================== */

document.getElementById(
"detailAvatar"
).textContent="📱";


document.getElementById(
"detailName"
).textContent=

const status=
document.getElementById(
"detailStatus"
);

user.status==="online"
?

:
"🔴 OFFLINE";

"detail-status "

(

grid.innerHTML=`

</div>

</div>

</div>


<div class="detail-item">

<div class="detail-item">

`;

===================================================== */

function closeDetail(){

"detailOverlay"
).style.display="none";

/* =====================================================
   TRAFFIC
===================================================== */

function updateTraffic(){

users.forEach(
user=>{

if(
user.status==="online"
){

user.uptime+=10;


/*
Simulasi traffic.
Nanti diganti RX/TX
MikroTik.
*/

user.download+=
Math.floor(
Math.random()*
120000
);

user.upload+=
Math.floor(
Math.random()*
40000
);


user.speed=
5+
Math.random()*
30;


user.lastSeen=
new Date()
.toLocaleTimeString(
"id-ID"
);

}

}
);

}


/* =====================================================
   STATUS
===================================================== */

function updateStatus(){

users.forEach(
user=>{

const old=
previousStatus[
user.id
];


if(
Math.random()<0.04
){

user.status=
user.status==="online"
?
"offline"
:
"online";

}


/* perubahan */

if(
old!==undefined &&
old!==user.status
){

if(
user.status==="online"
){

addLog(
"🟢 "
+user.name
+" kembali ONLINE",
true
);

showAlert(
"🟢",
"USER ONLINE",
user.name
+" kembali terhubung."
);

}

else{

addLog(
"🔴 "
+user.name
+" menjadi OFFLINE",
false
);

showAlert(
"🔴",
"USER OFFLINE",
user.name
+" terputus dari jaringan."
);

}

}


previousStatus[
user.id
]=
user.status;

}
);

}


/* =====================================================
   REFRESH
===================================================== */

function refreshNetwork(){

updateStatus();

updateTraffic();

renderUsers();

}


/* =====================================================
   TEST SPEED
===================================================== */

function testAllSpeed(){

users.forEach(
user=>{

if(
user.status==="online"
){

user.speed=
10+
Math.random()*
50;

}

}
);


renderUsers();


showAlert(
"⚡",
"TEST SPEED",
"Pengujian speed user selesai."
);


addLog(
"⚡ Test speed semua user selesai."
);

}


/* =====================================================
   LOG
===================================================== */

function addLog(
message,
type=null
){

const box=
document.getElementById(
"log"
);

const item=
document.createElement(
"div"
);

item.className=
"log-item";


if(type===true)
item.classList.add(
"log-online"
);


if(type===false)
item.classList.add(
"log-offline"
);


item.textContent=
new Date()
.toLocaleTimeString(
"id-ID"
)
+" — "
+message;


box.prepend(item);

}


/* =====================================================
   ALERT
===================================================== */

function showAlert(
icon,
title,
message
){

document.getElementById(
"alertIcon"
).textContent=
icon;


document.getElementById(
"alertTitle"
).textContent=
title;


document.getElementById(
"alertMessage"
).textContent=
message;


document.getElementById(
"alertOverlay"
).style.display=
"flex";


if(soundEnabled)
playSound();

}


function closeAlert(){

document.getElementById(
"alertOverlay"
).style.display=
"none";

}


/* =====================================================
   SOUND
===================================================== */

function toggleSound(){

soundEnabled=
!soundEnabled;


if(soundEnabled){

playSound();

showAlert(
"🔊",
"SUARA AKTIF",
"Notifikasi suara telah diaktifkan."
);

}

else{

showAlert(
"🔇",
"SUARA NONAKTIF",
"Notifikasi suara dimatikan."
);

}

}


/* =====================================================
   AUDIO
===================================================== */

function playSound(){

try{

audioContext=
audioContext ||
new(
window.AudioContext ||
window.webkitAudioContext
)();


const oscillator=
audioContext
.createOscillator();


const gain=
audioContext
.createGain();


oscillator.type=
"sine";


oscillator.frequency.value=
850;


gain.gain.value=
0.18;


oscillator.connect(
gain
);


gain.connect(
audioContext
.destination
);


oscillator.start();


oscillator.stop(
audioContext
.currentTime+
0.25
);

}
catch(e){

console.log(e);

}

}


/* =====================================================
   INITIAL
===================================================== */

users.forEach(
user=>{

previousStatus[
user.id
]=
user.status;

}
);


renderUsers();


addLog(
"🟢 myROBOT NETWORK dimulai."
);


addLog(
"📡 Monitoring jaringan aktif."
);


/* =====================================================
   AUTO REFRESH 10 DETIK
===================================================== */

setInterval(
refreshNetwork,
10000
);

</script>
